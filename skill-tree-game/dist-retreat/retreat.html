<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Future Coding Academy - Retreat Edition</title>
    <style>
      /* Loading styles */
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #8B4513 0%, #A0522D 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #F4E4BC;
        font-family: serif;
        z-index: 9999;
      }
      
      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(244, 228, 188, 0.3);
        border-left: 4px solid #F4E4BC;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .loading-text {
        font-size: 16px;
        font-weight: bold;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      }
      
      .loading-subtitle {
        font-size: 14px;
        opacity: 0.8;
        margin-top: 8px;
      }
    </style>
    <script type="module" crossorigin src="/assets/main-DuRkRPY2.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/main-B-z2P52P.css">
  </head>
  <body>
    <!-- Loading screen -->
    <div id="loading">
      <div style="text-align: center;">
        <div style="font-size: 48px; margin-bottom: 20px;">🏛️</div>
        <div class="spinner"></div>
        <div class="loading-text">Loading Retreat Dashboard...</div>
        <div class="loading-subtitle">Future Coding Academy - Retreat Edition</div>
      </div>
    </div>
    
    <!-- App root -->
    <div id="retreat-root"></div>
    
    <!-- React app script -->
    
    <!-- Hide loading screen once app loads -->
    <script>
      // Hide loading screen after a short delay to ensure React has mounted
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loading = document.getElementById('loading');
          if (loading) {
            loading.style.opacity = '0';
            loading.style.transition = 'opacity 0.3s ease';
            setTimeout(() => {
              loading.style.display = 'none';
            }, 300);
          }
        }, 500);
      });
    </script>
  </body>
</html>
